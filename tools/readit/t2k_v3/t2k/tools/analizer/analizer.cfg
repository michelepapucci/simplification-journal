
[Global]
encode = utf-8
debug = False
# 1 SS, 2 Tk, 3 PT, 4 Pa, 5 Re, 6 Te, 7 Mo, 8 Pr
#levels = Mo
levels = Pa
#levels = rfb, rfl, rfs, rfg, rdb, rdl, rds, rdg, Pr, Mo
pickled = False

[SentenceSplitter]
breaks = True
conf = t2k/tools/sentence_splitter/sentence_splitter.conf
model = t2k/tools/sentence_splitter/sentence_splitter_svm.joblib
vectorizer = t2k/tools/sentence_splitter/sentence_splitter_vectorizer.joblib

[Tokenizer]
use_lexicon = False
rule_filepath = t2k/tools/tokenizer/tokenizer_ruleset.txt
accented_words_filepath = t2k/tools/tokenizer/accented_word.txt

[Normalizer]
use_normalizer = False
normalizer_rules_filepath=t2k/tools/tokenizer/normalization_rules.txt

[PosTagger]
lexicon_path = Lessici/it/PosTagger/lexicon.tanl
word_forms_path = t2k/tools/postagger/training/word_forms_pos.conllu
conf = t2k/tools/postagger/models/DL/model_dl.conf
model_name = postagger
model_path = t2k/tools/postagger
do_morph_split = True
is_training = False
dump = False

[Parser]
#modello = Modelli/it/Parser/Parser.trainingTOT.MLP
model_path = t2k/tools/parser/saved_models/depparse/it_custom_parser.pt

[NameEntity]
conf = t2k/tools/name_entity/training/model_dl_it.conf
model_name = ner_back_logits_30
model_path = t2k/tools/name_entity
gazeteer_org = t2k/tools/name_entity/training/org_gazeteer.txt
gazeteer_location = t2k/tools/name_entity/training/loc_gazeteer.txt
gazeteer_people = t2k/tools/name_entity/training/person_gazeteer.txt
gazeteer_gpe = t2k/tools/name_entity/training/gpe_gazeteer.txt

[Sentiment]
conf = t2k/tools/sentiment/it-dl.conf
model_name = sentiment_splitted_10_epochs
model_path = t2k/tools/sentiment


[Readability_rdg]
lessico = Lessici/it/Readability/DizionarioFondamentale
modello = Modelli/it/Readability/readability_globale_doc
configurazione = Conf/it/readability_globale_doc.conf
printText = False
training = False
dump = False
infLength = 6
infSenteces = 1

